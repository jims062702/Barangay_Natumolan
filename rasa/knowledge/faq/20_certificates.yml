  - id: ask_request_online
    label: "Request online"
    question: "How do I request a certificate online?"
    framed:
      how_to: [request a certificate online, request a clearance online, apply online for a certificate, request documents online]
      can: [request a certificate online, apply for clearance online, request without going to the barangay]
    answer: |-
      With a resident portal account:
      • Sign in and open My Request Certificates
      • Choose the certificate and say what it is for — the page shows what it needs and costs
      • Follow its status there; you are notified when it is ready
      • Come to the Main Office to pay and claim it

      Residents can also press "Request a certificate" in this chat. No account yet? The Population Office issues them.
    related: [ask_portal_account, ask_track_request, ask_request_status, ask_claim_certificate]
    en: [how do i request a certificate online, can i request online, online certificate request, request a clearance online, apply online for a certificate, can i get a certificate without going there]
