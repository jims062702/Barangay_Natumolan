# Certificates and clearances.
#
# EVERY AMOUNT HERE IS THE ORDINANCE'S (18 January 2020), as the system
# charges it — backend/app/Services/Service/CertificateCatalogue.php. If the
# ordinance changes, change both, or the chatbot quotes a fee the counter
# does not charge.
#
# The ₱30 documentary stamp goes on EVERY certificate, on top of the fee,
# and is never waived — an exemption removes the fee, not the stamp.
topic: certificates
intents:
  - id: ask_certificates
    response: utter_certificates
    label: "What certificates are available?"
    question: "What certificates are available?"
    answer: |-
      The Main Office issues:
      • Barangay Clearance (also with Picture)
      • Business Barangay Clearance
      • Barangay Construction Clearance
      • Certificate of Residency (also with Birth Details)
      • Certificate of Indigency
      • Certificate of Low or No Income
      • Good Moral Character
      • First-Time Jobseeker Certification (RA 11261)
      • Certification of Death
      • Certification for Marriage License
      • Certification of Common Law Partner
      • Certification of Oneness of Name
      • Certificate of Appearance

      Walk in at the Main Office, or request one online through the resident portal.
    related: [ask_fees, ask_requirements, ask_request_online, ask_clearance]
    en: [what certificates can i get, what certificates are available, list of certificates, what documents does the barangay issue, what can i request from the barangay, what certifications do you offer, available barangay documents]
    tl: [anong mga certificate ang pwede makuha, ano ang mga sertipiko sa barangay, anong dokumento ang binibigay ng barangay, listahan ng certificate]
    ceb: [unsa mga certificate ang makuha, unsa nga dokumento ang ihatag sa barangay, lista sa mga certificate]
    test: [which papers can the barangay issue me, anong klaseng certification ang meron kayo]

  - id: ask_fees
    response: utter_fees
    label: "How much are the fees?"
    question: "How much are the certificate fees?"
    framed:
      fee: [a certificate, barangay certificates, the certificates, barangay documents]
    answer: |-
      Fees follow the barangay's fee ordinance:
      • Barangay Clearance — ₱30 to ₱200, depending on what it is for
      • Business Barangay Clearance — ₱25 to ₱750, depending on the kind of business
      • Certificate of Residency — ₱40
      • Barangay Construction Clearance — ₱50
      • Good Moral, Low or No Income, Appearance, Common Law Partner, Oneness of Name, Marriage License — ₱30 each
      • Indigency, First-Time Jobseeker, Death — no fee

      A ₱30 documentary stamp is added to every certificate, including the ones with no fee. You pay at the Main Office counter and get an official receipt.
    related: [ask_clearance_fee, ask_business_clearance_fee, ask_documentary_stamp, ask_fee_exemption]
    en: [how much are the fees, how much does a certificate cost, certificate fees, price list of certificates, how much do i pay, fee schedule, how much is a barangay certificate]
    tl: [magkano ang bayad sa certificate, magkano ang mga sertipiko, presyo ng certificate, magkano babayaran ko]
    ceb: [pila ang bayad sa certificate, pila ang presyo sa mga certificate, tagpila ang certificate]
    test: [what are the charges for barangay documents, magkano po lahat ng certificate]

  - id: ask_requirements
    response: utter_requirements
    label: "What do I need to bring?"
    question: "What are the requirements for a certificate?"
    framed:
      requirements: [a certificate, barangay certificates, a barangay document, getting a certificate]
    answer: |-
      For any certificate:
      • Bring a valid ID
      • You should be listed in the barangay's register of residents — if you are not yet, the Population Office can register you through the RBIM census

      Some certificates ask for more details on the form — for example the business name and kind for a business clearance, or your parents' names for a residency with birth details. The clerk will ask for these at the counter.
    related: [ask_register_resident, ask_fees, ask_certificates]
    en: [what are the requirements, what do i need to bring, requirements for a certificate, what documents do i need, what should i bring to the barangay, do i need an id]
    tl: [ano ang requirements, ano ang dadalhin ko, ano kailangan para sa certificate, kailangan ba ng id]
    ceb: [unsa ang requirements, unsa akong dalhon, unsa kinahanglan para sa certificate]
    test: [what papers must i present for a certificate, anong kailangan ko ipakita sa barangay]

  - id: ask_documentary_stamp
    label: "The documentary stamp"
    question: "What is the ₱30 documentary stamp?"
    framed:
      what: [the documentary stamp, the stamp fee, the extra 30 pesos]
    answer: |-
      The barangay puts a ₱30 documentary stamp on every certificate it issues. It is charged on top of the certificate's fee and is recorded separately.

      It still applies when the certificate has no fee, or when the fee is waived — an exemption removes the fee, not the stamp.
    related: [ask_fees, ask_fee_exemption, ask_payment]
    en: [what is the documentary stamp, why is there an extra 30 pesos, what is the extra charge, documentary stamp fee, is the stamp required]
    tl: [ano yung documentary stamp, bakit may dagdag na 30 pesos, para saan ang dagdag na bayad]
    ceb: [unsa ang documentary stamp, ngano naay dugang nga 30 pesos]
    test: [why did i pay 30 more than the fee, ano po yung stamp na binayaran]

  - id: ask_fee_exemption
    label: "Can the fee be waived?"
    question: "Can I be exempted from paying the fee?"
    framed:
      can: [get it for free, be exempted from the fee, not pay the fee, get a fee exemption]
    answer: |-
      Some certificates have no fee: Indigency, First-Time Jobseeker and Death certifications. For other certificates, an indigent resident may ask the Main Office for a fee exemption — the clerk records it on the certificate.

      The ₱30 documentary stamp still applies either way.
    related: [ask_indigency, ask_jobseeker, ask_documentary_stamp]
    en: [can the fee be waived, can i get it for free, fee exemption, i cannot afford the fee, free certificate, is there a discount]
    tl: [pwede ba libre, wala akong pambayad, pwede ba hindi magbayad, may discount ba]
    ceb: [pwede ba libre, wala koy ikabayad, naa bay discount]
    test: [are poor residents exempted from paying, pwede po bang walang bayad]

  - id: ask_payment
    label: "How do I pay?"
    question: "How do I pay for a certificate?"
    framed:
      how_to: [pay for a certificate, pay the fee, pay online]
    answer: |-
      Pay at the Main Office counter when you are there — the clerk issues an official receipt, and its number is recorded on your certificate. There is no online payment.
    related: [ask_fees, ask_request_online, ask_claim_certificate]
    en: [how do i pay, can i pay online, where do i pay, mode of payment, gcash payment, do you accept online payment, official receipt]
    tl: [saan magbabayad, pwede ba magbayad online, pwede ba gcash, paano magbayad]
    ceb: [asa ko mobayad, pwede ba mobayad online, pwede ba gcash]
    test: [can i settle the fee through an app, saan po ang bayaran]

  - id: ask_clearance
    label: "Barangay Clearance"
    question: "How do I get a Barangay Clearance?"
    framed:
      get: [barangay clearance, a barangay clearance, clearance, brgy clearance, clearance sa barangay]
      requirements: [barangay clearance, clearance, brgy clearance]
    answer: |-
      Go to the Main Office with a valid ID, or request it online through the resident portal. The clerk asks what the clearance is for, because the fee depends on it:
      • Mayor's Permit — ₱200
      • Employment Abroad — ₱100
      • Passport — ₱50
      • Loan Purposes — ₱40
      • Motor Installment — ₱30
      • Employment (local) and other purposes — ₱30

      Plus the ₱30 documentary stamp.
    related: [ask_clearance_with_picture, ask_business_clearance, ask_request_online, ask_track_request]
    en: [how do i get a barangay clearance, i need a barangay clearance, barangay clearance application, where do i get a clearance, how to apply for barangay clearance, request barangay clearance]
    tl: [paano kumuha ng barangay clearance, kailangan ko ng barangay clearance, saan kukuha ng clearance]
    ceb: [unsaon pagkuha og barangay clearance, kinahanglan ko og barangay clearance, asa makuha ang clearance]
    test: [steps to get a clearance from the barangay, pano po magpagawa ng clearance]

