  - id: ask_request_status
    label: "What the statuses mean"
    question: "What do the request statuses mean?"
    framed:
      what: [pending, processing, ready to claim, released status, the request status]
    answer: |-
      A certificate moves through:
      • Pending — received, waiting for a clerk
      • Processing — a clerk is preparing it
      • Ready to Claim — printed; come to the Main Office for it
      • Released — you have it

      A request you take back shows as Cancelled.
    related: [ask_track_request, ask_claim_certificate, ask_cancel_request]
    en: [what does pending mean, what does processing mean, what does ready to claim mean, what is released status, meaning of request status]
    tl: [ano ibig sabihin ng pending, ano ang ready to claim, ano meaning ng processing]
    ceb: [unsa ang pasabot sa pending, unsa ang ready to claim]
    test: [my request says processing what now, ano po ibig sabihin ng released]

  - id: ask_cancel_request
    label: "Cancel a request"
    question: "Can I cancel my certificate request?"
    framed:
      how_to: [cancel my request, cancel a certificate request, resume a cancelled request]
      can: [cancel my request, cancel my certificate request]
    answer: |-
      Yes. In the resident portal, open My Request Certificates and cancel the request. It is kept as Cancelled rather than deleted, so you can resume it later if you change your mind.
    related: [ask_track_request, ask_request_online]
    en: [can i cancel my request, how do i cancel a certificate request, i want to cancel my request, undo my request, resume a cancelled request]
    tl: [pwede ba i-cancel ang request, paano i-cancel ang request ko, ayoko na ng request]
