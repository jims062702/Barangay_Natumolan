  - id: ask_jobseeker
    label: "First-Time Jobseeker"
    question: "How do I get a First-Time Jobseeker Certification?"
    framed:
      get: [first time jobseeker certificate, first time jobseeker, jobseeker certification]
      fee: [first time jobseeker, first time jobseeker certificate]
      requirements: [first time jobseeker]
    answer: |-
      Under the First Time Jobseekers Assistance Act (RA 11261), the barangay certification for a first-time jobseeker has no barangay fee. It can be availed once, and you sign an oath of undertaking at the Main Office. The clerk also asks your educational level and whether you are still in school.

      The barangay's ₱30 documentary stamp is still added.
    related: [ask_clearance, ask_requirements, ask_fee_exemption]
