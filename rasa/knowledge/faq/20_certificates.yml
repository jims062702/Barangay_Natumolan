  - id: ask_certificate_validity
    label: "How long is it valid?"
    question: "How long is a certificate valid?"
    answer: |-
      It depends on the office or agency asking for it — many accept a certificate only if it was issued recently. Check with them, and request a new one from the barangay when you need it.
    related: [ask_request_online, ask_lost_certificate]
    en: [how long is a clearance valid, validity of barangay clearance, does the certificate expire, when does my clearance expire, how many months is it valid]
    tl: [gaano katagal valid ang clearance, nag-eexpire ba ang certificate]
    ceb: [unsa kadugay valid ang clearance, mo-expire ba ang certificate]
    test: [is a clearance from last year still usable, ilang buwan po ang bisa ng clearance]

  - id: ask_lost_certificate
    label: "Lost certificate"
    question: "I lost my certificate. What do I do?"
    framed:
      get: [a replacement certificate, another copy of my certificate, a new copy of my clearance]
    answer: |-
      Request a new one, the same way as before — at the Main Office or through the resident portal. The new certificate gets its own number and its own fee.

      If you need an Affidavit of Loss certification for another lost document, the ordinance fee is ₱50.
    related: [ask_request_online, ask_other_certifications]
    en: [i lost my certificate, lost my clearance, my certificate got lost, replacement certificate, how do i get another copy]
    tl: [nawala ang certificate ko, nawala ang clearance ko, paano kumuha ulit]
    ceb: [nawala akong certificate, nawala akong clearance, unsaon pagkuha usab]
    test: [i misplaced the clearance you gave me, nasira po ang certificate ko]

  - id: ask_unlisted_person
    label: "Not on the register yet"
    question: "Can I get a certificate if I am not yet on the register?"
    framed:
      can: [get a certificate even if not registered, get a clearance without being registered]
    answer: |-
      Not yet — a barangay certificate is issued only to a resident on the barangay's register. Go to the Population Office first and complete the RBIM census to be listed. Once you are on the register, the Main Office can issue your certificate.
    related: [ask_register_resident, ask_requirements]
    en: [i am not registered can i get a certificate, not in the list of residents, new resident certificate, just moved here can i get a clearance]
    tl: [hindi pa ako rehistrado pwede ba certificate, bagong lipat pwede ba kumuha ng clearance]
    ceb: [wala pa ko narehistro pwede ba certificate, bag-o lang ko nibalhin pwede ba clearance]
    test: [my name is not in your records yet, bago pa lang po ako dito pwede na ba]
