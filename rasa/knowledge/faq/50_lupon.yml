    tl: [pwede ba iurong ang reklamo, ayoko na ituloy ang kaso]
    ceb: [pwede ba bawion ang reklamo, dili na nako ipadayon ang kaso]
    test: [we made peace can i drop the case, iaatras ko na po ang reklamo]

  - id: ask_complaint_non_resident
    label: "Complaint by a non-resident"
    question: "Can I file a complaint if I do not live in Natumolan?"
    framed:
      can: [file a complaint even if i do not live here, complain as a non resident]
    answer: |-
      Yes, if the person you are complaining about lives in Barangay Natumolan — the case is heard in the respondent's barangay. You can file online from the website or in person at the Lupon desk, with a valid ID.
    related: [ask_file_complaint_online, ask_kp_coverage]
    en: [can a non resident file a complaint, i live in another barangay can i complain, the person lives in natumolan but i do not, complaint from outside the barangay]
    tl: [pwede ba magreklamo kahit hindi taga dito, taga ibang barangay ako pwede ba]
    ceb: [pwede ba mo reklamo bisan dili taga diri, taga laing barangay ko pwede ba]
    test: [i am from tagoloan proper but my debtor lives here, hindi po ako residente pero dito nakatira ang kaso ko]
