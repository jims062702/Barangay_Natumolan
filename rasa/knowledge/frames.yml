# The ways people ask the same KIND of question, in English, Tagalog and
# Bisaya. {s} is the subject — what the question is about — supplied by each
# intent in faq/*.yml:
#
#   - id: ask_clearance_fee
#     subjects: [barangay clearance, clearance for employment, brgy clearance]
#     frames: [fee]
#
# gives "how much is barangay clearance", "magkano ang clearance for
# employment", "pila ang brgy clearance", and every other pairing.
#
# THIS IS WHERE THE CHATBOT'S VOCABULARY COMES FROM. A handful of tidy
# sentences per question taught it those sentences and little else: on
# questions written differently it was right four times in ten. Every frame
# added here is a way of asking that every intent using it now understands.
#
# Subjects are plain noun phrases ("barangay clearance") for most frames,
# and verb phrases ("file a complaint") for `how_to` and `can`.

