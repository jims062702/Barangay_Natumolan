responses:
  utter_greet:
  - text: |-
      Kumusta! I'm the Barangay Natumolan assistant. Ask me about certificates and fees, filing a complaint, the VAWC Desk, the Health Station, the Population Office or the resident portal.
    buttons:
    - title: What certificates are available?
      payload: /ask_certificates
    - title: Office hours
      payload: /ask_office_hours
    - title: File a complaint
      payload: /ask_file_complaint
    - title: Get a portal account
      payload: /ask_portal_account
  utter_goodbye:
  - text: |-
      Salamat! Take care, and feel free to chat again anytime.
  utter_thanks:
  - text: |-
      Walang anuman! Happy to help. Is there anything else you need?
    buttons:
    - title: What certificates are available?
      payload: /ask_certificates
    - title: Office hours
      payload: /ask_office_hours
    - title: File a complaint
      payload: /ask_file_complaint
  utter_iamabot:
  - text: |-
      I'm the Barangay Natumolan chatbot — a computer program, not a person. I answer common questions about barangay services. For a real person, press "Talk to Clerk".
    buttons:
    - title: Talk to a person
      payload: /ask_human
    - title: What can you help with?
      payload: /ask_capabilities
  utter_capabilities:
  - text: |-
      I can help with:
      • Certificates and clearances — what they cost and what to bring
      • Requesting and tracking certificates online
      • Filing a complaint with the Lupon Tagapamayapa
      • The VAWC Desk, the Health Station and the Population Office
      • The resident portal and your account
      • Office hours and where to find the Barangay Hall
    buttons:
    - title: What certificates are available?
      payload: /ask_certificates
    - title: File a complaint
      payload: /ask_file_complaint
    - title: Get a portal account
      payload: /ask_portal_account
    - title: Offices in the Barangay Hall
      payload: /ask_offices
  utter_language:
  - text: |-
      Yes — you can type in English, Tagalog or Bisaya. I will answer in English, and the barangay staff speak all three if you visit.
    buttons:
    - title: What can you help with?
      payload: /ask_capabilities
    - title: Talk to a person
      payload: /ask_human
  utter_human:
  - text: |-
      Press "Talk to Clerk (live agent)" below the chat. The Barangay Clerk answers one person at a time during office hours, Monday to Friday, 8:00 AM – 5:00 PM.

      The live desk is for registered residents, so you will be asked to sign in to the resident portal first.
    buttons:
    - title: Get a portal account
      payload: /ask_portal_account
    - title: Office hours
      payload: /ask_office_hours
    - title: Contact the barangay
      payload: /ask_contact
  utter_developers:
  - text: |-
      The Barangay Natumolan Management Information System was developed by Team Pentagram 🫰

      • Honeyleth S. Monteadora — Project Manager
      • Angeline O. Auza — Technical Writer
      • VJ L. Batal — System Analyst 1
      • Rachiel C. Torrejos — System Analyst 2
      • Johnvyll A. Gumahin — Frontend Developer
      • James Gasang — Backend Developer

      Salamat for using our system! 💜
    buttons:
    - title: What can you help with?
      payload: /ask_capabilities
  utter_default:
  - text: |-
      Sorry, I did not quite get that. You can ask me about certificates, fees, office hours, filing a complaint, the VAWC Desk, the Health Station or the resident portal — or try one of these:
    buttons:
    - title: What certificates are available?
      payload: /ask_certificates
    - title: Office hours
      payload: /ask_office_hours
    - title: File a complaint
      payload: /ask_file_complaint
    - title: Contact the barangay
      payload: /ask_contact
  utter_office_hours:
  - text: |-
      🕗 The Barangay Hall is open Monday to Friday, 8:00 AM – 5:00 PM, except holidays.

      All offices follow the same schedule: the Main Office, the VAWC Desk, the Lupon Tagapamayapa, the Population Office and the Health Station.
    buttons:
    - title: Open on weekends?
      payload: /ask_open_weekend
    - title: Where is the Barangay Hall?
      payload: /ask_location
    - title: Walk in
      payload: /ask_walk_in
  utter_open_weekend:
  - text: |-
      The Barangay Hall is open Monday to Friday only, 8:00 AM – 5:00 PM. It is closed on Saturdays, Sundays and holidays.

      In an emergency at any time, call 911.
    buttons:
    - title: Office hours
      payload: /ask_office_hours
    - title: Request online
      payload: /ask_request_online
    - title: In danger now
      payload: /ask_vawc_emergency
  utter_location:
  - text: |-
      📍 The Barangay Hall is in Barangay Natumolan, Tagoloan, Misamis Oriental 9001, Philippines. There is a map at the bottom of this website, in the Contact section.
    buttons:
    - title: Office hours
      payload: /ask_office_hours
    - title: Contact the barangay
      payload: /ask_contact
    - title: Offices in the Barangay Hall
      payload: /ask_offices
  utter_contact:
  - text: |-
      📧 Email: barangaynatumolan@gmail.com
      You can also send a message through the Contact section of this website — it goes straight to the Main Office staff — or visit the Barangay Hall, Monday to Friday, 8:00 AM – 5:00 PM.
    buttons:
    - title: Email address
      payload: /ask_email
    - title: Send a message
      payload: /ask_contact_form
    - title: Where is the Barangay Hall?
      payload: /ask_location
  utter_email:
  - text: |-
      📧 barangaynatumolan@gmail.com

      For anything that needs a document, come to the Barangay Hall — requests are not filed by email.
    buttons:
    - title: Contact the barangay
      payload: /ask_contact
    - title: Send a message
      payload: /ask_contact_form
    - title: Request online
      payload: /ask_request_online
  utter_contact_form:
  - text: |-
      Yes. Use the Contact section at the bottom of this website — your message goes straight to the Main Office staff. Include a way to reach you so they can reply.
    buttons:
    - title: Contact the barangay
      payload: /ask_contact
    - title: Email address
      payload: /ask_email
    - title: Talk to a person
      payload: /ask_human
  utter_offices:
  - text: |-
      The Barangay Hall has:
      • Main Office — certificates, clearances and the service counter
      • Lupon Tagapamayapa — disputes and complaints under the Katarungang Pambarangay
      • VAWC Desk — confidential help for women and children facing violence
      • Population Office — the register of residents and households, and portal accounts
      • Health Station — consultations, immunization and maternal and child care
    buttons:
    - title: What certificates are available?
      payload: /ask_certificates
    - title: The Lupon Tagapamayapa
      payload: /ask_lupon
    - title: VAWC Desk
      payload: /ask_vawc_help
    - title: Health services
      payload: /ask_health
  utter_officials:
  - text: |-
      The Punong Barangay, the Sangguniang Barangay members, the Sangguniang Kabataan and the other officials are listed with their photos in the Officials section of this website.
    buttons:
    - title: The Punong Barangay
      payload: /ask_punong_barangay
    - title: Sangguniang Kabataan
      payload: /ask_sk
    - title: Offices in the Barangay Hall
      payload: /ask_offices
  utter_punong_barangay:
  - text: |-
      The Punong Barangay (barangay captain) is named in the Officials section of this website.

      The Punong Barangay heads the barangay, presides over the Sangguniang Barangay, and chairs the Lupon Tagapamayapa — including the first mediation hearings of a complaint.
    buttons:
    - title: Barangay officials
      payload: /ask_officials
    - title: When are hearings?
      payload: /ask_hearing_schedule
    - title: Barangay Protection Order
      payload: /ask_bpo
  utter_sk:
  - text: |-
      The Sangguniang Kabataan (SK) is the barangay's youth council. It runs programmes for the youth of the barangay. Its chairperson and members are listed in the Officials section of this website, and its news appears under News & Announcements.
    buttons:
    - title: Barangay officials
      payload: /ask_officials
    - title: News & announcements
      payload: /ask_announcements
  utter_announcements:
  - text: |-
      Barangay news and announcements are posted in the News & Announcements section of this website. Residents with a portal account also see them under Announcements after signing in.
    buttons:
    - title: What the portal can do
      payload: /ask_portal_features
    - title: Sangguniang Kabataan
      payload: /ask_sk
  utter_walk_in:
  - text: |-
      Yes — walk-ins are welcome, Monday to Friday, 8:00 AM – 5:00 PM. Go to the Main Office, present a valid ID and tell the clerk what you need. Your request is recorded on the spot; fees are paid at the counter and you get an official receipt.
    buttons:
    - title: What do I need to bring?
      payload: /ask_requirements
    - title: How much are the fees?
      payload: /ask_fees
    - title: Office hours
      payload: /ask_office_hours
  utter_appointment:
  - text: |-
      There is no appointment booking — you do not need one. Walk in at the Main Office, Monday to Friday, 8:00 AM – 5:00 PM, or request a certificate online through the resident portal and come in when it is ready to claim.
    buttons:
    - title: Walk in
      payload: /ask_walk_in
    - title: Request online
      payload: /ask_request_online
    - title: Office hours
      payload: /ask_office_hours
  utter_data_privacy:
  - text: |-
      The barangay keeps your records to provide its services. Records at the VAWC Desk are confidential by law (RA 9262) and are seen only by the VAWC Desk. For any question about your own records, ask at the Main Office or the Population Office.
    buttons:
    - title: Update my details
      payload: /ask_update_profile
    - title: Is it confidential?
      payload: /ask_vawc_confidential
  utter_certificates:
  - text: |-
      The Main Office issues:
      • Barangay Clearance (also with Picture)
      • Business Barangay Clearance
      • Barangay Construction Clearance
      • Certificate of Residency (also with Birth Details)
      • Certificate of Indigency
      • Certificate of Low or No Income
      • Good Moral Character
      • First-Time Jobseeker Certification (RA 11261)
      • Certification of Death
      • Certification for Marriage License
      • Certification of Common Law Partner
      • Certification of Oneness of Name
      • Certificate of Appearance

      Walk in at the Main Office, or request one online through the resident portal.
    buttons:
    - title: How much are the fees?
      payload: /ask_fees
    - title: What do I need to bring?
      payload: /ask_requirements
    - title: Request online
      payload: /ask_request_online
    - title: Barangay Clearance
      payload: /ask_clearance
  utter_fees:
  - text: |-
      Fees follow the barangay's fee ordinance:
      • Barangay Clearance — ₱30 to ₱200, depending on what it is for
      • Business Barangay Clearance — ₱25 to ₱750, depending on the kind of business
      • Certificate of Residency — ₱40
      • Barangay Construction Clearance — ₱50
      • Good Moral, Low or No Income, Appearance, Common Law Partner, Oneness of Name, Marriage License — ₱30 each
      • Indigency, First-Time Jobseeker, Death — no fee

      A ₱30 documentary stamp is added to every certificate, including the ones with no fee. You pay at the Main Office counter and get an official receipt.
    buttons:
    - title: Clearance fee
      payload: /ask_clearance_fee
    - title: Business clearance fee
      payload: /ask_business_clearance_fee
    - title: The documentary stamp
      payload: /ask_documentary_stamp
    - title: Can the fee be waived?
      payload: /ask_fee_exemption
  utter_requirements:
  - text: |-
      For any certificate:
      • Bring a valid ID
      • You should be listed in the barangay's register of residents — if you are not yet, the Population Office can register you through the RBIM census

      Some certificates ask for more details on the form — for example the business name and kind for a business clearance, or your parents' names for a residency with birth details. The clerk will ask for these at the counter.
    buttons:
    - title: Register as a resident
      payload: /ask_register_resident
    - title: How much are the fees?
      payload: /ask_fees
    - title: What certificates are available?
      payload: /ask_certificates
  utter_documentary_stamp:
  - text: |-
      The barangay puts a ₱30 documentary stamp on every certificate it issues. It is charged on top of the certificate's fee and is recorded separately.

      It still applies when the certificate has no fee, or when the fee is waived — an exemption removes the fee, not the stamp.
    buttons:
    - title: How much are the fees?
      payload: /ask_fees
    - title: Can the fee be waived?
      payload: /ask_fee_exemption
    - title: How do I pay?
      payload: /ask_payment
  utter_fee_exemption:
  - text: |-
      Some certificates have no fee: Indigency, First-Time Jobseeker and Death certifications. For other certificates, an indigent resident may ask the Main Office for a fee exemption — the clerk records it on the certificate.

      The ₱30 documentary stamp still applies either way.
    buttons:
    - title: Certificate of Indigency
      payload: /ask_indigency
    - title: First-Time Jobseeker
      payload: /ask_jobseeker
    - title: The documentary stamp
      payload: /ask_documentary_stamp
  utter_payment:
  - text: |-
      Pay at the Main Office counter when you are there — the clerk issues an official receipt, and its number is recorded on your certificate. There is no online payment.
    buttons:
    - title: How much are the fees?
      payload: /ask_fees
    - title: Request online
      payload: /ask_request_online
    - title: Claim my certificate
      payload: /ask_claim_certificate
  utter_clearance:
  - text: |-
      Go to the Main Office with a valid ID, or request it online through the resident portal. The clerk asks what the clearance is for, because the fee depends on it:
      • Mayor's Permit — ₱200
      • Employment Abroad — ₱100
      • Passport — ₱50
      • Loan Purposes — ₱40
      • Motor Installment — ₱30
      • Employment (local) and other purposes — ₱30

      Plus the ₱30 documentary stamp.
    buttons:
    - title: Clearance with Picture
      payload: /ask_clearance_with_picture
    - title: Business clearance
      payload: /ask_business_clearance
    - title: Request online
      payload: /ask_request_online
    - title: Track my request
      payload: /ask_track_request
  utter_clearance_fee:
  - text: |-
      A Barangay Clearance is priced by what it is for:
      • Mayor's Permit — ₱200
      • Employment Abroad — ₱100
      • Passport — ₱50
      • Loan Purposes — ₱40
      • Motor Installment — ₱30
      • Employment (local) and other purposes — ₱30

      A ₱30 documentary stamp is added. A clearance for a business is a Business Barangay Clearance, priced by the kind of business.
    buttons:
    - title: Barangay Clearance
      payload: /ask_clearance
    - title: Business clearance fee
      payload: /ask_business_clearance_fee
    - title: The documentary stamp
      payload: /ask_documentary_stamp
  utter_clearance_with_picture:
  - text: |-
      It is a Barangay Clearance that carries your photograph. The photo is taken at the Main Office counter by the clerk — photos brought from home are not used — and your thumbmarks are inked on the printed sheet there. So you need to come in person.

      The fee is the same as a Barangay Clearance: it depends on the purpose, plus the ₱30 documentary stamp.
    buttons:
    - title: Clearance fee
      payload: /ask_clearance_fee
    - title: Barangay Clearance
      payload: /ask_clearance
    - title: Claim my certificate
      payload: /ask_claim_certificate
  utter_business_clearance:
  - text: |-
      Go to the Main Office with a valid ID. The clerk records the business name and the kind of business, which sets the fee under the ordinance — from ₱25 to ₱750 — plus the ₱30 documentary stamp.

      A Barangay Clearance for a Mayor's Permit is ₱200.
    buttons:
    - title: Business clearance fee
      payload: /ask_business_clearance_fee
    - title: Clearance fee
      payload: /ask_clearance_fee
    - title: What do I need to bring?
      payload: /ask_requirements
  utter_business_clearance_fee:
  - text: |-
      It depends on the kind of business. Some examples from the ordinance:
      • Trisikad — ₱25
      • Sari-sari Store, Softdrinks Retailer, Trimotor — ₱50
      • General Merchandise, Junk Shop, Auto Shop, Vulcanizing Shop, Internet Café (per unit) — ₱100
      • Eatery — ₱200
      • Catering, Construction Supply, Food Processing, Pharmaceuticals — ₱500
      • Buy and Sell Falcata & Gemelina — ₱750

      Plus the ₱30 documentary stamp. The clerk finds your kind of business on the full list.
    buttons:
    - title: Business clearance
      payload: /ask_business_clearance
    - title: The documentary stamp
      payload: /ask_documentary_stamp
    - title: How do I pay?
      payload: /ask_payment
  utter_construction_clearance:
  - text: |-
      A Barangay Construction Clearance is ₱50, plus the ₱30 documentary stamp. At the Main Office the clerk records the applicant's name and the work being applied for.
    buttons:
    - title: Building permit certification
      payload: /ask_building_permit_certification
    - title: How much are the fees?
      payload: /ask_fees
    - title: What do I need to bring?
      payload: /ask_requirements
  utter_residency:
  - text: |-
      A Certificate of Residency is ₱40, plus the ₱30 documentary stamp. It states that you live in Barangay Natumolan and for how many years. Bring a valid ID to the Main Office, or request it through the resident portal.

      A Certificate of Residency with Birth Details also states your parents' names, and costs the same.
    buttons:
    - title: What do I need to bring?
      payload: /ask_requirements
    - title: Request online
      payload: /ask_request_online
    - title: Register as a resident
      payload: /ask_register_resident
  utter_indigency:
  - text: |-
      A Certificate of Indigency has no fee — only the ₱30 documentary stamp. It is often asked for when applying for medical, educational or legal assistance. Bring a valid ID to the Main Office, or request it through the resident portal, and say what it is for.
    buttons:
    - title: Low or No Income certificate
      payload: /ask_low_income
    - title: Can the fee be waived?
      payload: /ask_fee_exemption
    - title: Request online
      payload: /ask_request_online
  utter_low_income:
  - text: |-
      A Certificate of Low or No Income is ₱30, plus the ₱30 documentary stamp. Request it at the Main Office with a valid ID, or through the resident portal.
    buttons:
    - title: Certificate of Indigency
      payload: /ask_indigency
    - title: How much are the fees?
      payload: /ask_fees
    - title: Request online
      payload: /ask_request_online
  utter_good_moral:
  - text: |-
      A Good Moral Character certificate is ₱30, plus the ₱30 documentary stamp. Request it at the Main Office with a valid ID, or through the resident portal, and say what it is for.
    buttons:
    - title: Barangay Clearance
      payload: /ask_clearance
    - title: Request online
      payload: /ask_request_online
    - title: How much are the fees?
      payload: /ask_fees
  utter_jobseeker:
  - text: |-
      Under the First Time Jobseekers Assistance Act (RA 11261), the barangay certification for a first-time jobseeker has no barangay fee. It can be availed once, and you sign an oath of undertaking at the Main Office. The clerk also asks your educational level and whether you are still in school.

      The barangay's ₱30 documentary stamp is still added.
    buttons:
    - title: Barangay Clearance
      payload: /ask_clearance
    - title: What do I need to bring?
      payload: /ask_requirements
    - title: Can the fee be waived?
      payload: /ask_fee_exemption
  utter_death_certification:
  - text: |-
      A Certification of Death has no fee — only the ₱30 documentary stamp. At the Main Office the clerk records the deceased's name, age and address; the date, time and place of death; your relationship to the deceased; and who is requesting it.

      To record the death in the barangay's register, tell the Population Office too.
    buttons:
    - title: Report a death
      payload: /ask_report_death
    - title: How much are the fees?
      payload: /ask_fees
  utter_marriage_certification:
  - text: |-
      A Certification for Marriage License is ₱30, plus the ₱30 documentary stamp. At the Main Office the clerk records the civil status you state, the documents you attach, and — if you are widowed — your late spouse's name.
    buttons:
    - title: Common Law Partner
      payload: /ask_common_law
    - title: How much are the fees?
      payload: /ask_fees
    - title: What do I need to bring?
      payload: /ask_requirements
  utter_common_law:
  - text: |-
      A Certification of Common Law Partner is ₱30, plus the ₱30 documentary stamp. At the Main Office the clerk records your partner's name and how many years you have been together.
    buttons:
    - title: Certification for Marriage License
      payload: /ask_marriage_certification
    - title: How much are the fees?
      payload: /ask_fees
  utter_oneness_of_name:
  - text: |-
      It certifies that two different spellings or versions of a name belong to one person — for example the name on a payroll and your correct name. It is ₱30, plus the ₱30 documentary stamp; the clerk records both names.
    buttons:
    - title: What certificates are available?
      payload: /ask_certificates
    - title: How much are the fees?
      payload: /ask_fees
  utter_appearance:
  - text: |-
      It certifies that you appeared at the barangay on official business — often asked of employees on official travel. It is ₱30, plus the ₱30 documentary stamp. The form records your position, your station and the dates you appeared.
    buttons:
    - title: What certificates are available?
      payload: /ask_certificates
    - title: How much are the fees?
      payload: /ask_fees
  utter_other_certifications:
  - text: |-
      The barangay's fee ordinance also lists these certifications:
      • Transport of animals — ₱50 per head (pig, goat); ₱100 per head (cow, carabao, horse)
      • Lumber transport — ₱100
      • Affidavit of Loss — ₱50
      • Has Business/Income — ₱50
      • Farms — ₱50
      • Building Permit — ₱50
      • Birth Certificate — ₱40
      • Certificate for Titling — ₱100
      • Garage — ₱100 residential, ₱500 commercial

      Ask at the Main Office for any of these.
    buttons:
    - title: Building permit certification
      payload: /ask_building_permit_certification
    - title: What certificates are available?
      payload: /ask_certificates
    - title: How much are the fees?
      payload: /ask_fees
  utter_building_permit_certification:
  - text: |-
      Yes. Under the fee ordinance, the barangay certification for a Building Permit is ₱50. The building permit itself comes from the municipality; ask at the Main Office for the barangay's part.
    buttons:
    - title: Construction clearance
      payload: /ask_construction_clearance
    - title: Other certifications
      payload: /ask_other_certifications
  utter_request_online:
  - text: |-
      With a resident portal account:
      • Sign in and open My Request Certificates
      • Choose the certificate and say what it is for — the page shows what it needs and costs
      • Follow its status there; you are notified when it is ready
      • Come to the Main Office to pay and claim it

      Residents can also press "Request a certificate" in this chat. No account yet? The Population Office issues them.
    buttons:
    - title: Get a portal account
      payload: /ask_portal_account
    - title: Track my request
      payload: /ask_track_request
    - title: What the statuses mean
      payload: /ask_request_status
    - title: Claim my certificate
      payload: /ask_claim_certificate
  utter_track_request:
  - text: |-
      Sign in to the resident portal and open My Request Certificates — each request shows its status, and you get a notification when it moves on. No account? Ask at the Main Office with your request's number.
    buttons:
    - title: What the statuses mean
      payload: /ask_request_status
    - title: Cancel a request
      payload: /ask_cancel_request
    - title: Claim my certificate
      payload: /ask_claim_certificate
  utter_request_status:
  - text: |-
      A certificate moves through:
      • Pending — received, waiting for a clerk
      • Processing — a clerk is preparing it
      • Ready to Claim — printed; come to the Main Office for it
      • Released — you have it

      A request you take back shows as Cancelled.
    buttons:
    - title: Track my request
      payload: /ask_track_request
    - title: Claim my certificate
      payload: /ask_claim_certificate
    - title: Cancel a request
      payload: /ask_cancel_request
  utter_cancel_request:
  - text: |-
      Yes. In the resident portal, open My Request Certificates and cancel the request. It is kept as Cancelled rather than deleted, so you can resume it later if you change your mind.
    buttons:
    - title: Track my request
      payload: /ask_track_request
    - title: Request online
      payload: /ask_request_online
  utter_claim_certificate:
  - text: |-
      When it is Ready to Claim, come to the Main Office during office hours, Monday to Friday, 8:00 AM – 5:00 PM. Pay any fee at the counter, and the clerk releases the certificate to you.
    buttons:
    - title: How do I pay?
      payload: /ask_payment
    - title: Office hours
      payload: /ask_office_hours
    - title: Verify a certificate
      payload: /ask_verify_certificate
  utter_processing_time:
  - text: |-
      It depends on how many people are ahead of you at the counter. Online requests show their status in the resident portal, and you are notified when the certificate is Ready to Claim.
    buttons:
    - title: Track my request
      payload: /ask_track_request
    - title: What the statuses mean
      payload: /ask_request_status
    - title: Walk in
      payload: /ask_walk_in
  utter_verify_certificate:
  - text: |-
      Open the Certificate Verification page of this website (/verify) and enter the reference number printed on the certificate, or scan its QR code. It shows whether the certificate is valid and who it was issued to.
    buttons:
    - title: Claim my certificate
      payload: /ask_claim_certificate
    - title: Lost certificate
      payload: /ask_lost_certificate
  utter_certificate_validity:
  - text: |-
      It depends on the office or agency asking for it — many accept a certificate only if it was issued recently. Check with them, and request a new one from the barangay when you need it.
    buttons:
    - title: Request online
      payload: /ask_request_online
    - title: Lost certificate
      payload: /ask_lost_certificate
  utter_lost_certificate:
  - text: |-
      Request a new one, the same way as before — at the Main Office or through the resident portal. The new certificate gets its own number and its own fee.

      If you need an Affidavit of Loss certification for another lost document, the ordinance fee is ₱50.
    buttons:
    - title: Request online
      payload: /ask_request_online
    - title: Other certifications
      payload: /ask_other_certifications
  utter_unlisted_person:
  - text: |-
      Not yet — a barangay certificate is issued only to a resident on the barangay's register. Go to the Population Office first and complete the RBIM census to be listed. Once you are on the register, the Main Office can issue your certificate.
    buttons:
    - title: Register as a resident
      payload: /ask_register_resident
    - title: What do I need to bring?
      payload: /ask_requirements
  utter_portal_account:
  - text: |-
      Resident portal accounts are issued by the Population Office to residents on the barangay's register. Visit the Population Office at the Barangay Hall with a valid ID. They create the account with your email address; you then enter the activation code sent to that email to start using it.
    buttons:
    - title: Activation code
      payload: /ask_activation_code
    - title: What the portal can do
      payload: /ask_portal_features
    - title: Register as a resident
      payload: /ask_register_resident
  utter_portal_features:
  - text: |-
      After signing in you can:
      • Request certificates and follow their status
      • File a complaint with the Lupon and follow its reference number
      • See your Lupon records — cases you filed, cases against you, and hearing dates
      • Read your health records (read only)
      • Read barangay announcements
      • Update your occupation, civil status and contact number
      • Chat with the Barangay Clerk
    buttons:
    - title: Request online
      payload: /ask_request_online
    - title: Update my details
      payload: /ask_update_profile
    - title: My Lupon records
      payload: /ask_portal_lupon_records
    - title: My health records
      payload: /ask_portal_health_records
  utter_activation_code:
  - text: |-
      When the Population Office creates your account, a 6-digit activation code is emailed to you. It is valid for 10 minutes. Didn't get it, or it expired? Check your spam folder, then ask the Population Office to send a fresh code.
    buttons:
    - title: Signing in
      payload: /ask_portal_login
    - title: Forgot password
      payload: /ask_forgot_password
    - title: Get a portal account
      payload: /ask_portal_account
  utter_portal_login:
  - text: |-
      Press Login on this website and sign in with the email address and password of your resident account. The account has to be activated first with the code emailed to you.
    buttons:
    - title: Forgot password
      payload: /ask_forgot_password
    - title: Activation code
      payload: /ask_activation_code
    - title: What the portal can do
      payload: /ask_portal_features
  utter_forgot_password:
  - text: |-
      On the Login page, choose "Forgot password". A code is sent to your account's email address; enter it, then set a new password. The barangay staff cannot see or set your password for you.
    buttons:
    - title: Signing in
      payload: /ask_portal_login
    - title: Change my email
      payload: /ask_change_email
  utter_change_email:
  - text: |-
      Sign in and open My Profile. Enter the new address — a code is sent to it, and the change takes effect only when you enter that code. Your old address keeps working until then.
    buttons:
    - title: Update my details
      payload: /ask_update_profile
    - title: Forgot password
      payload: /ask_forgot_password
  utter_update_profile:
  - text: |-
      In the portal, open My Profile to update your occupation, civil status and contact number yourself. Anything else on your record — your name, birthday, address or household — is updated by the Population Office; visit them with a valid ID.
    buttons:
    - title: Change my email
      payload: /ask_change_email
    - title: Update my household
      payload: /ask_update_household
    - title: Population Office
      payload: /ask_population
  utter_portal_lupon_records:
  - text: |-
      In the portal, Lupon Records shows cases you filed, cases filed against you, your hearing dates and each case's history. A case appears there once its summons has been printed.
    buttons:
    - title: When are hearings?
      payload: /ask_hearing_schedule
    - title: Status of my complaint
      payload: /ask_complaint_status
    - title: I received a summons
      payload: /ask_received_summons
  utter_portal_health_records:
  - text: |-
      Yes — in the portal, Health Records shows your records from the Health Station. It is read only: records are written at the station by the person who took the reading, so ask the Health Station if something needs correcting.
    buttons:
    - title: Health services
      payload: /ask_health
    - title: What the portal can do
      payload: /ask_portal_features
  utter_non_resident_account:
  - text: |-
      No — portal accounts are for residents on the barangay's register. Without an account you can still use this chatbot, file a complaint online from the website, and verify a certificate.
    buttons:
    - title: File online
      payload: /ask_file_complaint_online
    - title: Verify a certificate
      payload: /ask_verify_certificate
    - title: Register as a resident
      payload: /ask_register_resident
  utter_population:
  - text: |-
      The Population Office keeps the barangay's register of residents and households, runs the RBIM census, records births, deaths and people moving in or out, keeps the sector lists (senior citizens, PWDs, 4Ps and others), and issues resident portal accounts.
    buttons:
    - title: Register as a resident
      payload: /ask_register_resident
    - title: Update my household
      payload: /ask_update_household
    - title: Get a portal account
      payload: /ask_portal_account
  utter_register_resident:
  - text: |-
      Go to the Population Office at the Barangay Hall. They fill in the RBIM census form — the Registry of Barangay Inhabitants and Migrants — with you, for everyone in your household. That is how a person is added to the barangay's register. Bring a valid ID.
    buttons:
    - title: Registration documents
      payload: /ask_registration_documents
    - title: What is RBIM?
      payload: /ask_rbim
    - title: Get a portal account
      payload: /ask_portal_account
  utter_registration_documents:
  - text: |-
      Bring a valid ID. The census asks about every member of your household — names, birthdays, relationships, and similar details — so it helps to have those at hand, and any documents that show them. The Population Office will say if anything else is needed for your case.
    buttons:
    - title: Register as a resident
      payload: /ask_register_resident
    - title: What is RBIM?
      payload: /ask_rbim
  utter_rbim:
  - text: |-
      RBIM is the Registry of Barangay Inhabitants and Migrants — the barangay's census of every household and everyone in it. The Population Office fills it in with the household, and it is how a person is added to the register.
    buttons:
    - title: Register as a resident
      payload: /ask_register_resident
    - title: Update my household
      payload: /ask_update_household
  utter_update_household:
  - text: |-
      Visit the Population Office with a valid ID. They update your household's census record — people who joined or left the household, changes in details, and so on.
    buttons:
    - title: Moving in or out
      payload: /ask_transfer
    - title: Report a birth
      payload: /ask_report_birth
    - title: Report a death
      payload: /ask_report_death
  utter_transfer:
  - text: |-
      Tell the Population Office. Moving into Natumolan, they register you through the RBIM census; moving out, they record the transfer on the register.
    buttons:
    - title: Register as a resident
      payload: /ask_register_resident
    - title: Update my household
      payload: /ask_update_household
  utter_report_birth:
  - text: |-
      Tell the Population Office, who add the baby to your household on the barangay's register. The birth certificate itself is registered with the municipal civil registrar.
    buttons:
    - title: Update my household
      payload: /ask_update_household
    - title: Immunization
      payload: /ask_immunization
  utter_report_death:
  - text: |-
      Tell the Population Office, who record it on the barangay's register. If you need a barangay Certification of Death, the Main Office issues it — no fee, only the ₱30 documentary stamp.
    buttons:
    - title: Certification of Death
      payload: /ask_death_certification
    - title: Update my household
      payload: /ask_update_household
  utter_senior_citizen:
  - text: |-
      Everyone on the register aged 60 or older is on the barangay's senior citizen list, kept by the Population Office. The Health Station also does check-ups for seniors. For a senior citizen ID and national benefits, ask at the Barangay Hall where to apply.
    buttons:
    - title: PWD, 4Ps and other lists
      payload: /ask_sector_lists
    - title: Senior check-ups
      payload: /ask_senior_checkup
  utter_sector_lists:
  - text: |-
      Yes. The Population Office keeps the barangay's sector lists — senior citizens, persons with disability, 4Ps beneficiaries, solo parents and others — for barangay programmes. To be added to a list, visit the Population Office.
    buttons:
    - title: Senior citizens
      payload: /ask_senior_citizen
    - title: Update my household
      payload: /ask_update_household
  utter_lupon:
  - text: |-
      The Lupon Tagapamayapa settles disputes between residents through the Katarungang Pambarangay — mediation and conciliation at the barangay, which many disputes must go through before they can be taken to court.

      A complaint is first mediated by the Punong Barangay. If there is no settlement, it goes to conciliation.

      The Lupon desk is at the Barangay Hall, Monday to Friday, 8:00 AM – 5:00 PM.
    buttons:
    - title: File a complaint
      payload: /ask_file_complaint
    - title: What cases the Lupon handles
      payload: /ask_kp_coverage
    - title: When are hearings?
      payload: /ask_hearing_schedule
  utter_file_complaint:
  - text: |-
      You can file a Katarungang Pambarangay complaint in two ways:
      • Online — from the "File a complaint" button in this chat or on the website. You attach a photo of a valid ID and get an Online Complaint Reference Number.
      • In person — at the Lupon desk in the Barangay Hall, Monday to Friday, 8:00 AM – 5:00 PM.

      Either way, the Lupon accepts the complaint at the counter with your valid ID, and the case number is issued then.
    buttons:
    - title: File online
      payload: /ask_file_complaint_online
    - title: What cases the Lupon handles
      payload: /ask_kp_coverage
    - title: Filing fee
      payload: /ask_filing_fee
    - title: When are hearings?
      payload: /ask_hearing_schedule
  utter_file_complaint_online:
  - text: |-
      Yes. Press "File a complaint" in this chat, or open the Complaints card on the website. You describe what happened, name who it is against, and attach a photo of a valid ID; evidence is optional.

      You get an Online Complaint Reference Number (like OC-2026-0001). It is not a case number: bring the same ID to the Barangay Office, where the complaint is verified and the Lupon accepts it.
    buttons:
    - title: Reference number
      payload: /ask_complaint_reference
    - title: What to bring for a complaint
      payload: /ask_complaint_requirements
    - title: File a complaint
      payload: /ask_file_complaint
  utter_complaint_reference:
  - text: |-
      It is the number you get when you file a complaint online, like OC-2026-0001. It shows the office received your complaint — it is not a case number. The KP case number is issued when the Lupon accepts the complaint at the Barangay Office.

      Residents with a portal account see their reference numbers, and later the case number, under File a Complaint.
    buttons:
    - title: Status of my complaint
      payload: /ask_complaint_status
    - title: File online
      payload: /ask_file_complaint_online
  utter_complaint_status:
  - text: |-
      With a portal account: File a Complaint lists your online complaints with their status and, once accepted, the KP case number. Lupon Records shows your cases and their hearings once the summons is printed.

      Without an account, ask at the Lupon desk with your reference number.
    buttons:
    - title: My Lupon records
      payload: /ask_portal_lupon_records
    - title: When are hearings?
      payload: /ask_hearing_schedule
    - title: Reference number
      payload: /ask_complaint_reference
  utter_complaint_requirements:
  - text: |-
      • A valid ID — the office checks it against you at the counter
      • The name and address of the person you are complaining about
      • What happened, and when and where
      • Any evidence you have — optional

      A filing fee is paid at the Barangay Office; the Lupon confirms it on sight of the official receipt.
    buttons:
    - title: Filing fee
      payload: /ask_filing_fee
    - title: File online
      payload: /ask_file_complaint_online
    - title: What cases the Lupon handles
      payload: /ask_kp_coverage
  utter_filing_fee:
  - text: |-
      Yes. The filing fee is paid at the Barangay Office, and the Lupon marks it paid on sight of the official receipt. The summons is not issued until it is paid. Ask at the Lupon desk for the amount.
    buttons:
    - title: What to bring for a complaint
      payload: /ask_complaint_requirements
    - title: Summons and notice
      payload: /ask_summons
  utter_kp_coverage:
  - text: |-
      Disputes between people living in the same city or municipality, for example over money, property, damage or neighbour quarrels. The Katarungang Pambarangay does not cover, among others (RA 7160, Sec. 408):
      • disputes where one party is the government, or a public officer acting in office
      • offences punishable by more than one year in prison or a fine over ₱5,000
      • offences with no private offended party
      • real property in different cities or municipalities
      • parties living in different cities or municipalities, unless their barangays adjoin and they agree

      Violence against women and children is never mediated — it goes to the VAWC Desk.
    buttons:
    - title: File a complaint
      payload: /ask_file_complaint
    - title: Can the Lupon mediate VAWC?
      payload: /ask_vawc_not_mediated
    - title: Barangay before court?
      payload: /ask_kp_before_court
  utter_kp_before_court:
  - text: |-
      For disputes the Katarungang Pambarangay covers, yes — the case must go through the barangay first. If there is no settlement, the Lupon issues a Certificate to File Action, which the court asks for.
    buttons:
    - title: Certificate to File Action
      payload: /ask_cfa
    - title: What cases the Lupon handles
      payload: /ask_kp_coverage
  utter_summons:
  - text: |-
      Once the filing fee is paid and the case is scheduled, the office prints a summons for the person complained about and a notice of hearing for the complainant. Both give the day and the time of the hearing. Residents with a portal account also see the case and the hearing in Lupon Records.
    buttons:
    - title: When are hearings?
      payload: /ask_hearing_schedule
    - title: I received a summons
      payload: /ask_received_summons
    - title: Missing a hearing
      payload: /ask_missed_hearing
  utter_received_summons:
  - text: |-
      Come to the Barangay Hall on the day and at the time written on the summons. Appear in person — lawyers do not take part in Katarungang Pambarangay hearings. Bring anything that supports your side. If you have a portal account, the case is under Lupon Records → Cases Against Me.
    buttons:
    - title: Missing a hearing
      payload: /ask_missed_hearing
    - title: What happens at a hearing
      payload: /ask_hearing_what_happens
    - title: Can I bring a lawyer?
      payload: /ask_lawyer_hearing
  utter_hearing_schedule:
  - text: |-
      • Mediation with the Punong Barangay — on Tuesdays, up to three sittings
      • Conciliation — on Thursdays, if the Tuesdays end without a settlement

      Hearings start from 8:00 AM, one case after another. The exact day and time are on the summons and the notice of hearing.
    buttons:
    - title: What happens at a hearing
      payload: /ask_hearing_what_happens
    - title: Missing a hearing
      payload: /ask_missed_hearing
    - title: Summons and notice
      payload: /ask_summons
  utter_hearing_what_happens:
  - text: |-
      Both sides appear in person. The Punong Barangay first tries to help you reach an agreement (mediation). If you agree, the terms are written down as an amicable settlement and signed. If the Tuesday sittings end without one, the case goes to conciliation on Thursdays. If there is still no settlement, a Certificate to File Action may be issued so the case can go to court.
    buttons:
    - title: Amicable settlement
      payload: /ask_settlement
    - title: Certificate to File Action
      payload: /ask_cfa
    - title: Can I bring a lawyer?
      payload: /ask_lawyer_hearing
  utter_missed_hearing:
  - text: |-
      Tell the Lupon at the Barangay Hall before the day. Hearing days are fixed and printed on the summons, so they are not moved casually.

      Missing a hearing without a valid reason has consequences under the Katarungang Pambarangay rules: a complainant's complaint may be dismissed, and a respondent may lose the right to file a counterclaim.
    buttons:
    - title: When are hearings?
      payload: /ask_hearing_schedule
    - title: Withdraw a complaint
      payload: /ask_withdraw_complaint
  utter_lawyer_hearing:
  - text: |-
      No. In Katarungang Pambarangay proceedings the parties appear in person, without lawyers (RA 7160, Sec. 415). Minors and persons who cannot act for themselves may be assisted by their next of kin who are not lawyers.
    buttons:
    - title: What happens at a hearing
      payload: /ask_hearing_what_happens
    - title: I received a summons
      payload: /ask_received_summons
  utter_settlement:
  - text: |-
      It is the written agreement the parties sign when their dispute is settled at the barangay. After 10 days, if not repudiated, it has the force of a final court judgment (RA 7160, Sec. 416). If it is not complied with, the Lupon can enforce it within six months; after that, through the court.
    buttons:
    - title: Taking back a settlement
      payload: /ask_repudiation
    - title: What happens at a hearing
      payload: /ask_hearing_what_happens
  utter_repudiation:
  - text: |-
      Only within 10 days of the settlement, by a sworn statement to the Lupon chairman, and only on the ground that your consent was obtained through fraud, violence or intimidation (RA 7160, Sec. 418). After that it is final.
    buttons:
    - title: Amicable settlement
      payload: /ask_settlement
    - title: Certificate to File Action
      payload: /ask_cfa
  utter_cfa:
  - text: |-
      A Certificate to File Action (CFA) is issued when a dispute covered by the Katarungang Pambarangay is not settled at the barangay. It allows the complainant to take the case to court or another government office. The fee under the ordinance is ₱200.
    buttons:
    - title: Barangay before court?
      payload: /ask_kp_before_court
    - title: What happens at a hearing
      payload: /ask_hearing_what_happens
  utter_withdraw_complaint:
  - text: |-
      Yes — the complainant may withdraw the complaint at the Lupon desk, and the case is closed with the reason recorded.
    buttons:
    - title: Status of my complaint
      payload: /ask_complaint_status
    - title: Amicable settlement
      payload: /ask_settlement
  utter_complaint_non_resident:
  - text: |-
      Yes, if the person you are complaining about lives in Barangay Natumolan — the case is heard in the respondent's barangay. You can file online from the website or in person at the Lupon desk, with a valid ID.
    buttons:
    - title: File online
      payload: /ask_file_complaint_online
    - title: What cases the Lupon handles
      payload: /ask_kp_coverage
  utter_vawc:
  - text: |-
      The VAWC Desk (Violence Against Women and their Children) gives confidential help to women and children facing abuse. Reports are handled privately by the VAWC Desk officer.

      Go to the VAWC Desk at the Barangay Hall, Monday to Friday, 8:00 AM – 5:00 PM. If you or someone else is in immediate danger, call 911.
    buttons:
    - title: Barangay Protection Order
      payload: /ask_bpo
    - title: Is it confidential?
      payload: /ask_vawc_confidential
    - title: In danger now
      payload: /ask_vawc_emergency
    - title: Where is the VAWC Desk?
      payload: /ask_vawc_location
  utter_vawc_emergency:
  - text: |-
      If you or someone else is in danger right now, call 911, or go to the nearest police station and ask for the Women and Children Protection Desk. Get to a safe place first if you can.

      The barangay's VAWC Desk helps from the Barangay Hall, Monday to Friday, 8:00 AM – 5:00 PM.
    buttons:
    - title: VAWC Desk
      payload: /ask_vawc_help
    - title: Barangay Protection Order
      payload: /ask_bpo
  utter_bpo:
  - text: |-
      A Barangay Protection Order (BPO) orders the person committing violence to stop causing or threatening physical harm. Under RA 9262 it is issued by the Punong Barangay — or, if unavailable, a Barangay Kagawad — on the day it is applied for, and it is in effect for 15 days.

      Apply at the VAWC Desk. For longer protection, the desk can help you seek a protection order from the court.
    buttons:
    - title: VAWC Desk
      payload: /ask_vawc_help
    - title: Is it confidential?
      payload: /ask_vawc_confidential
    - title: Who can report?
      payload: /ask_vawc_who_can_report
  utter_vawc_confidential:
  - text: |-
      Yes. Records of violence against women and their children are confidential by law (RA 9262). They are handled by the VAWC Desk only, are not shown in the resident portal, and are never shared with the person you are reporting.
    buttons:
    - title: VAWC Desk
      payload: /ask_vawc_help
    - title: Barangay Protection Order
      payload: /ask_bpo
  utter_vawc_who_can_report:
  - text: |-
      Yes. Violence against women and their children is a public crime under RA 9262 — anyone who knows of it may report it. Go to the VAWC Desk at the Barangay Hall, or call 911 if the person is in danger now.
    buttons:
    - title: VAWC Desk
      payload: /ask_vawc_help
    - title: In danger now
      payload: /ask_vawc_emergency
    - title: Child abuse
      payload: /ask_child_abuse
  utter_vawc_types:
  - text: |-
      Under RA 9262, violence against women and their children includes:
      • Physical violence — hitting, hurting or threatening to hurt
      • Sexual violence
      • Psychological violence — intimidation, harassment, public humiliation, stalking
      • Economic abuse — for example controlling or withholding money needed for support

      It covers acts by a husband, former husband, partner, former partner, or someone with whom the woman has or had a sexual or dating relationship or a child in common.
    buttons:
    - title: VAWC Desk
      payload: /ask_vawc_help
    - title: Barangay Protection Order
      payload: /ask_bpo
    - title: Who can report?
      payload: /ask_vawc_who_can_report
  utter_vawc_not_mediated:
  - text: |-
      No. RA 9262 prohibits barangay mediation or conciliation of violence against women and their children. These cases go to the VAWC Desk, never to a Lupon hearing where the woman would have to face the person who hurt her.
    buttons:
    - title: VAWC Desk
      payload: /ask_vawc_help
    - title: Barangay Protection Order
      payload: /ask_bpo
  utter_child_abuse:
  - text: |-
      Go to the VAWC Desk at the Barangay Hall, Monday to Friday, 8:00 AM – 5:00 PM. If the child is in danger now, call 911 or go to the nearest police station and ask for the Women and Children Protection Desk. You do not need to be related to the child to report.
    buttons:
    - title: Who can report?
      payload: /ask_vawc_who_can_report
    - title: In danger now
      payload: /ask_vawc_emergency
  utter_vawc_location:
  - text: |-
      The VAWC Desk is at the Barangay Hall, Barangay Natumolan, Tagoloan, Misamis Oriental — open Monday to Friday, 8:00 AM – 5:00 PM. Ask for the VAWC Desk officer.
    buttons:
    - title: VAWC Desk
      payload: /ask_vawc_help
    - title: In danger now
      payload: /ask_vawc_emergency
  utter_health:
  - text: |-
      The Barangay Health Station offers:
      • Consultations
      • Immunization for children
      • Prenatal and maternal care
      • Child health check-ups
      • Check-ups for senior citizens
      • Referral for animal bites

      It is open Monday to Friday, 8:00 AM – 5:00 PM.
    buttons:
    - title: Immunization
      payload: /ask_immunization
    - title: Prenatal care
      payload: /ask_prenatal
    - title: Health Station hours
      payload: /ask_health_hours
    - title: Animal bite
      payload: /ask_animal_bite
  utter_health_hours:
  - text: |-
      The Health Station follows the Barangay Hall's hours: Monday to Friday, 8:00 AM – 5:00 PM. For a particular service — an immunization day, for example — ask the Health Station for this month's schedule.
    buttons:
    - title: Health services
      payload: /ask_health
    - title: Immunization
      payload: /ask_immunization
    - title: Where is the Health Station?
      payload: /ask_health_location
  utter_health_location:
  - text: |-
      The Health Station is at the Barangay Hall, Barangay Natumolan, Tagoloan, Misamis Oriental.
    buttons:
    - title: Health Station hours
      payload: /ask_health_hours
    - title: Health services
      payload: /ask_health
  utter_immunization:
  - text: |-
      The Health Station immunizes children and keeps each child's immunization record. Ask the Health Station for this month's immunization days, and bring the child's immunization card if you have one. Residents with a portal account can see their records under Health Records.
    buttons:
    - title: Child check-ups
      payload: /ask_child_health
    - title: Health Station hours
      payload: /ask_health_hours
    - title: My health records
      payload: /ask_portal_health_records
  utter_prenatal:
  - text: |-
      Yes. The Health Station gives prenatal and maternal care and keeps a record of each visit. Visit during its hours, Monday to Friday, 8:00 AM – 5:00 PM, and bring your records if you have them.
    buttons:
    - title: Immunization
      payload: /ask_immunization
    - title: Child check-ups
      payload: /ask_child_health
    - title: Health Station hours
      payload: /ask_health_hours
  utter_child_health:
  - text: |-
      Yes. The Health Station does child health check-ups and keeps each child's health and immunization records. Visit during its hours, Monday to Friday, 8:00 AM – 5:00 PM.
    buttons:
    - title: Immunization
      payload: /ask_immunization
    - title: Health services
      payload: /ask_health
  utter_senior_checkup:
  - text: |-
      Yes. The Health Station does check-ups for senior citizens and keeps a record of them. Visit during its hours, Monday to Friday, 8:00 AM – 5:00 PM.
    buttons:
    - title: Senior citizens
      payload: /ask_senior_citizen
    - title: Health services
      payload: /ask_health
  utter_animal_bite:
  - text: |-
      Wash the wound right away with soap and running water for at least 10 minutes. Then go to the Health Station, which refers animal bites to an animal bite treatment center for anti-rabies care. Do not wait — rabies shots work best when started early.
    buttons:
    - title: Health services
      payload: /ask_health
    - title: Health Station hours
      payload: /ask_health_hours
  utter_bhw:
  - text: |-
      Barangay Health Workers (BHWs) help the Health Station reach households — health visits, immunization and records. Ask at the Health Station who covers your area.
    buttons:
    - title: Health services
      payload: /ask_health
    - title: Where is the Health Station?
      payload: /ask_health_location
  utter_medicine:
  - text: |-
      What medicines are available changes with the Health Station's supply. Ask the Health Station directly, Monday to Friday, 8:00 AM – 5:00 PM.
    buttons:
    - title: Health services
      payload: /ask_health
    - title: Health Station hours
      payload: /ask_health_hours
  utter_tanod:
  - text: |-
      The barangay tanod keep the peace in the barangay. For a disturbance happening now, go to the Barangay Hall. In an emergency, call 911.
    buttons:
    - title: Noise and disturbance
      payload: /ask_noise_complaint
    - title: File a complaint
      payload: /ask_file_complaint
    - title: In danger now
      payload: /ask_vawc_emergency
  utter_noise_complaint:
  - text: |-
      For noise or a disturbance happening now, go to the Barangay Hall so the tanod can respond, or call 911 in an emergency.

      If it keeps happening, you can file a complaint with the Lupon Tagapamayapa, which calls both sides to a hearing.
    buttons:
    - title: File a complaint
      payload: /ask_file_complaint
    - title: Barangay tanod
      payload: /ask_tanod
    - title: What cases the Lupon handles
      payload: /ask_kp_coverage
  utter_disaster:
  - text: |-
      Follow the announcements of the barangay — posted under News & Announcements on this website — and of the municipality. Ask at the Barangay Hall where the evacuation area for your zone is. If you are in danger, call 911.
    buttons:
    - title: News & announcements
      payload: /ask_announcements
    - title: Barangay tanod
      payload: /ask_tanod
  utter_garbage:
  - text: |-
      Ask at the Barangay Hall for the garbage collection schedule in your zone — it is set by the barangay and the municipality and can change.
    buttons:
    - title: Report a problem
      payload: /ask_report_problem
    - title: News & announcements
      payload: /ask_announcements
  utter_curfew:
  - text: |-
      Ask at the Barangay Hall about any curfew or other ordinance in effect — ordinances are passed and changed by the Sangguniang Barangay and the municipality.
    buttons:
    - title: Barangay tanod
      payload: /ask_tanod
    - title: Barangay officials
      payload: /ask_officials
  utter_report_problem:
  - text: |-
      Report it at the Main Office in the Barangay Hall, or send a message through the Contact section of this website. Say exactly where it is.
    buttons:
    - title: Send a message
      payload: /ask_contact_form
    - title: Contact the barangay
      payload: /ask_contact
  utter_stray_animals:
  - text: |-
      Report stray or dangerous animals at the Barangay Hall. If someone has been bitten, wash the wound with soap and running water and go to the Health Station right away.
    buttons:
    - title: Animal bite
      payload: /ask_animal_bite
    - title: Report a problem
      payload: /ask_report_problem
  utter_cedula:
  - text: |-
      The cedula (community tax certificate) is issued by the municipal treasurer's office; barangays may also collect it on the municipality's behalf. Ask at the Main Office whether it is issued at the Barangay Hall.
    buttons:
    - title: What certificates are available?
      payload: /ask_certificates
    - title: Office hours
      payload: /ask_office_hours
  utter_barangay_id:
  - text: |-
      Ask at the Main Office whether barangay IDs are being issued and what is needed. For proof that you live here, the Certificate of Residency is ₱40, plus the ₱30 documentary stamp.
    buttons:
    - title: Certificate of Residency
      payload: /ask_residency
    - title: Register as a resident
      payload: /ask_register_resident
  utter_assistance:
  - text: |-
      Ask at the Main Office about assistance available now — programmes depend on the barangay's and the municipality's funds. Agencies giving medical, educational or burial assistance usually ask for a Certificate of Indigency, which has no fee (only the ₱30 documentary stamp).
    buttons:
    - title: Certificate of Indigency
      payload: /ask_indigency
    - title: Low or No Income certificate
      payload: /ask_low_income
  utter_lost_found:
  - text: |-
      Bring found items, or report a loss, at the Barangay Hall, Monday to Friday, 8:00 AM – 5:00 PM. If what you lost was a document, you may need an Affidavit of Loss for the agency that issued it.
    buttons:
    - title: Lost certificate
      payload: /ask_lost_certificate
    - title: Other certifications
      payload: /ask_other_certifications
session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
